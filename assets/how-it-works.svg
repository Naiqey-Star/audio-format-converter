<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6b8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" rx="14" fill="#f7f9fc"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="13.5" fill="none" stroke="#dbe3f0"/>

  <text x="34" y="42" font-size="19" font-weight="700" fill="#1f2d45">转转 工作流程</text>
  <text x="34" y="65" font-size="13" fill="#6b7a99">常驻托盘，自动把音乐客户端下载的加密文件转成通用 MP3 / FLAC，并保留标签</text>

  <!-- 输入 -->
  <rect x="34" y="90" width="196" height="150" rx="11" fill="#ffffff" stroke="#dbe3f0"/>
  <text x="132" y="114" font-size="12.5" font-weight="700" fill="#243352" text-anchor="middle">音乐客户端下载目录</text>
  <rect x="52" y="128" width="160" height="24" rx="6" fill="#eef2f9"/>
  <text x="62" y="144" font-size="11" fill="#44557a">song.ncm</text>
  <rect x="52" y="157" width="160" height="24" rx="6" fill="#eef2f9"/>
  <text x="62" y="173" font-size="11" fill="#44557a">track.mflac</text>
  <rect x="52" y="186" width="160" height="24" rx="6" fill="#eef2f9"/>
  <text x="62" y="202" font-size="11" fill="#44557a">album.kgm</text>
  <rect x="52" y="215" width="160" height="20" rx="6" fill="#fdf1e3"/>
  <text x="62" y="229" font-size="10.5" fill="#a2641c">加密格式 · 播放器打不开</text>

  <line x1="232" y1="165" x2="256" y2="165" stroke="#5b6b8c" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- 引擎 -->
  <rect x="260" y="90" width="248" height="256" rx="11" fill="#ffffff" stroke="#2f6bff" stroke-width="1.6"/>
  <rect x="260" y="90" width="248" height="34" rx="11" fill="#2f6bff"/>
  <rect x="260" y="112" width="248" height="12" fill="#2f6bff"/>
  <text x="384" y="113" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">转转 引擎</text>

  <circle cx="286" cy="150" r="12" fill="#e7f0ff" stroke="#b9d0ff"/>
  <text x="286" y="155" font-size="11.5" font-weight="700" fill="#1b4fd8" text-anchor="middle">1</text>
  <text x="308" y="146" font-size="12" font-weight="600" fill="#243352">扫描目录 · 识别加密格式</text>
  <text x="308" y="162" font-size="10.5" fill="#7b8aa8">每 2~3 秒一次，按扩展名分派</text>

  <circle cx="286" cy="196" r="12" fill="#e7f0ff" stroke="#b9d0ff"/>
  <text x="286" y="201" font-size="11.5" font-weight="700" fill="#1b4fd8" text-anchor="middle">2</text>
  <text x="308" y="192" font-size="12" font-weight="600" fill="#243352">等待文件下载完成</text>
  <text x="308" y="208" font-size="10.5" fill="#7b8aa8">大小连续稳定 N 秒才动手</text>

  <circle cx="286" cy="242" r="12" fill="#e7f0ff" stroke="#b9d0ff"/>
  <text x="286" y="247" font-size="11.5" font-weight="700" fill="#1b4fd8" text-anchor="middle">3</text>
  <text x="308" y="238" font-size="12" font-weight="600" fill="#243352">解密，还原原始音频</text>
  <text x="308" y="254" font-size="10.5" fill="#7b8aa8">NCM / QMC / KGM / KWM 分派处理</text>

  <circle cx="286" cy="288" r="12" fill="#e7f0ff" stroke="#b9d0ff"/>
  <text x="286" y="293" font-size="11.5" font-weight="700" fill="#1b4fd8" text-anchor="middle">4</text>
  <text x="308" y="284" font-size="12" font-weight="600" fill="#243352">转码 + 写入标签</text>
  <text x="308" y="300" font-size="10.5" fill="#7b8aa8">无损→FLAC / 有损→MP3，ffmpeg 转容器</text>

  <circle cx="286" cy="330" r="12" fill="#e8f6ee" stroke="#bfe3cb"/>
  <text x="286" y="335" font-size="11.5" font-weight="700" fill="#1c6b3c" text-anchor="middle">5</text>
  <text x="308" y="326" font-size="12" font-weight="600" fill="#243352">记录状态（可选删除原文件）</text>
  <text x="308" y="342" font-size="10.5" fill="#7b8aa8">同一文件不会重复处理</text>

  <line x1="510" y1="165" x2="534" y2="165" stroke="#5b6b8c" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- 输出 -->
  <rect x="538" y="90" width="328" height="150" rx="11" fill="#ffffff" stroke="#dbe3f0"/>
  <text x="702" y="114" font-size="12.5" font-weight="700" fill="#243352" text-anchor="middle">通用音频文件</text>
  <rect x="556" y="128" width="160" height="24" rx="6" fill="#eaf6ee" stroke="#bfe3cb"/>
  <text x="566" y="144" font-size="11" fill="#1c6b3c">song.mp3</text>
  <rect x="556" y="157" width="160" height="24" rx="6" fill="#eaf6ee" stroke="#bfe3cb"/>
  <text x="566" y="173" font-size="11" fill="#1c6b3c">track.flac</text>
  <rect x="556" y="186" width="160" height="24" rx="6" fill="#eaf6ee" stroke="#bfe3cb"/>
  <text x="566" y="202" font-size="11" fill="#1c6b3c">album.mp3</text>
  <text x="730" y="144" font-size="10.5" fill="#6b7a99">标题 / 艺术家</text>
  <text x="730" y="162" font-size="10.5" fill="#6b7a99">专辑 / 封面</text>
  <text x="730" y="180" font-size="10.5" fill="#6b7a99">全部保留</text>
  <rect x="556" y="215" width="294" height="20" rx="6" fill="#eef2f9"/>
  <text x="566" y="229" font-size="10.5" fill="#44557a">任何播放器 / 手机 / 车机 / NAS 都能直接播</text>

  <!-- 支持平台 -->
  <text x="538" y="276" font-size="12" font-weight="700" fill="#243352">支持的加密格式</text>
  <rect x="538" y="288" width="150" height="28" rx="8" fill="#ffffff" stroke="#dbe3f0"/>
  <text x="613" y="307" font-size="11" fill="#44557a" text-anchor="middle">网易云 .ncm</text>
  <rect x="700" y="288" width="166" height="28" rx="8" fill="#ffffff" stroke="#dbe3f0"/>
  <text x="783" y="307" font-size="11" fill="#44557a" text-anchor="middle">QQ音乐 .qmc* .mflac .mgg</text>
  <rect x="538" y="324" width="150" height="28" rx="8" fill="#ffffff" stroke="#dbe3f0"/>
  <text x="613" y="343" font-size="11" fill="#44557a" text-anchor="middle">酷狗 .kgm .kgma .vpr</text>
  <rect x="700" y="324" width="166" height="28" rx="8" fill="#ffffff" stroke="#dbe3f0"/>
  <text x="783" y="343" font-size="11" fill="#44557a" text-anchor="middle">酷我 .kwm</text>

  <text x="34" y="374" font-size="11" fill="#8294b3">仅供转换你本人合法获得的文件，请遵守著作权法律与各平台用户协议。</text>
</svg>
